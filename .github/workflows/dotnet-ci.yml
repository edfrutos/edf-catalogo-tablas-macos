# Compila la solución y ejecuta E2E (Playwright) contra MongoDB en contenedor de servicio.
# Requiere Ubuntu (PowerShell + dependencias de Chromium). Ajusta ramas en `on` si tu flujo usa otros nombres.
name: .NET CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore and build (Release)
        run: |
          dotnet restore edf_catalogotablas_net.sln
          dotnet build edf_catalogotablas_net.sln -c Release --no-restore

      - name: Unit tests (sin integración Mongo)
        run: >-
          dotnet test EDFCatalogoTablasNet.Tests/EDFCatalogoTablasNet.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName!~.Integration."
          --verbosity minimal

  e2e:
    name: E2E (Mongo + Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.runCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      MongoDB__ConnectionString: mongodb://127.0.0.1:27017
      MongoDB__DatabaseName: edf_ci_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      # .deb oficial evita depender del repo packages.microsoft.com por versión de Ubuntu del runner.
      - name: Install PowerShell (Playwright installer)
        shell: bash
        env:
          PWSH_VERSION: 7.4.6
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget
          deb="powershell_${PWSH_VERSION}-1.deb_amd64.deb"
          wget -q "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/${deb}" -O "/tmp/${deb}"
          sudo dpkg -i "/tmp/${deb}" || sudo apt-get install -f -y
          pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Restore and build (Debug, for E2E + playwright.ps1)
        run: |
          dotnet restore edf_catalogotablas_net.sln
          dotnet build edf_catalogotablas_net.sln -c Debug --no-restore

      - name: Integration tests (Mongo servicio)
        run: >-
          dotnet test EDFCatalogoTablasNet.Tests/EDFCatalogoTablasNet.Tests.csproj
          -c Debug --no-build
          --filter "FullyQualifiedName~.Integration."
          --verbosity minimal

      - name: Install Chromium (Playwright)
        run: |
          pwsh EDFCatalogoTablasNet.E2E/bin/Debug/net9.0/playwright.ps1 install chromium --with-deps

      - name: Run E2E script
        run: bash ./scripts/e2e-test.sh
